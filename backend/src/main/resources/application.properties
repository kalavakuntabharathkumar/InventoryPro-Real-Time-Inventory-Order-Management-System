# Application
spring.application.name=InventoryPro
server.port=8080

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:inventoryprodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=InventoryProSecretKey2025SuperLongSecretKeyForJWTSigning
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Low-stock threshold
app.inventory.low-stock-threshold=10

# Logging
logging.level.com.inventorypro=INFO
logging.level.org.springframework.security=WARN
